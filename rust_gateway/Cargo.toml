[package]
name = "vjepa-risk-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tower-http = { version = "0.6", features = ["cors"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
